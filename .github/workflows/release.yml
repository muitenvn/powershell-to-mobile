name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK with Gradle
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-apks/PowerShell-Mobile.apk \;
          echo "Generated APK:"
          ls -lh release-apks/PowerShell-Mobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerShell-Mobile-APK
          path: release-apks/PowerShell-Mobile.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ format('PowerShell Mobile Release {0}', startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number)) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-apks/PowerShell-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
